<title>Painel de Gestão de Projetos</title>

<style>
:root{
  --ink:#132224;
  --ink-soft:#3d5457;
  --bg:#f2f5f3;
  --panel:#ffffff;
  --line:#dbe4e0;
  --teal:#1f6f5c;
  --teal-deep:#0f4c40;
  --amber:#c9822a;
  --amber-bg:#fbead2;
  --green:#2f7d4f;
  --green-bg:#e2f1e6;
  --red:#b8433a;
  --red-bg:#f9e2df;
  --gray:#7c8b8a;
  --gray-bg:#e8ece9;
  --accent:#d4772f;
  --grid-line:#c6d6d0;
  --radius:10px;
  --shadow:0 1px 2px rgba(19,34,36,.06), 0 6px 20px rgba(19,34,36,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:64px 64px;
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

/* header */
header.top{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;flex-wrap:wrap;
  padding-bottom:20px;margin-bottom:22px;
  border-bottom:2px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand .mark{
  width:40px;height:40px;border-radius:8px;
  background:linear-gradient(135deg,var(--teal),var(--teal-deep));
  position:relative;flex:none;
  box-shadow:var(--shadow);
}
.brand .mark::before,.brand .mark::after{
  content:"";position:absolute;background:rgba(255,255,255,.85);
}
.brand .mark::before{left:9px;top:8px;width:3px;height:24px;border-radius:2px;}
.brand .mark::after{left:17px;top:14px;width:14px;height:3px;border-radius:2px;
  box-shadow:0 7px 0 rgba(255,255,255,.85);}
.brand h1{font-family:'Sora',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
.top-meta{text-align:right;font-size:12px;color:var(--ink-soft);}
.top-meta b{display:block;color:var(--ink);font-size:13px;font-family:'IBM Plex Mono',monospace;}

/* tabs */
nav.tabs{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px;
}
nav.tabs button{
  font-family:'Sora',sans-serif;font-weight:600;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
  padding:9px 16px;border-radius:999px;cursor:pointer;transition:.15s;
}
nav.tabs button:hover{border-color:var(--teal);color:var(--teal-deep);}
nav.tabs button.active{
  background:var(--ink);color:#fff;border-color:var(--ink);
}

section.tab{display:none;}
section.tab.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.tab-head{margin-bottom:18px;}
.tab-head h2{font-family:'Sora',sans-serif;font-size:26px;margin:0 0 4px;letter-spacing:-.01em;}
.tab-head .sub{color:var(--ink-soft);font-size:13.5px;}
.tab-head .ref{
  display:inline-block;margin-top:8px;font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;background:var(--gray-bg);color:var(--ink-soft);
  padding:3px 9px;border-radius:6px;
}

/* kpi grid */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi .val{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;line-height:1.1;}
.kpi .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:5px;text-transform:uppercase;letter-spacing:.03em;}
.kpi.accent-teal .val{color:var(--teal-deep);}
.kpi.accent-amber .val{color:var(--amber);}
.kpi.accent-green .val{color:var(--green);}
.kpi.accent-red .val{color:var(--red);}
.kpi .tick{position:absolute;right:12px;top:12px;width:8px;height:8px;border-radius:50%;}
.kpi.accent-teal .tick{background:var(--teal);}
.kpi.accent-amber .tick{background:var(--amber);}
.kpi.accent-green .tick{background:var(--green);}
.kpi.accent-red .tick{background:var(--red);}

/* panels/cards */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;
}
.panel h3{font-family:'Sora',sans-serif;font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.panel h3 .n{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:#fff;background:var(--ink);
  padding:2px 7px;border-radius:5px;
}

table{width:100%;border-collapse:collapse;font-size:12.6px;}
table caption{text-align:left;font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
thead th{
  text-align:left;font-family:'Sora',sans-serif;font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.02em;color:var(--ink-soft);
  padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap;
}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:hover{background:#f7faf8;}
.tbl-wrap{overflow-x:auto;}

.badge{
  display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
  white-space:nowrap;
}
.badge.done{background:var(--green-bg);color:var(--green);}
.badge.wip{background:var(--amber-bg);color:var(--amber);}
.badge.todo{background:var(--gray-bg);color:var(--gray);}
.badge.late{background:var(--red-bg);color:var(--red);}

/* roadmap cards */
.rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:20px;}
.rm-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);position:relative;
}
.rm-card.is-new{border-color:var(--amber);}
.rm-card.is-new::after{
  content:"ATUALIZADO";position:absolute;top:-8px;right:10px;
  background:var(--amber);color:#fff;font-size:9px;font-weight:700;
  padding:2px 7px;border-radius:5px;letter-spacing:.03em;
}
.rm-card h4{font-family:'Sora',sans-serif;font-size:13.5px;margin:0 0 10px;line-height:1.25;}
.rm-bar{height:6px;border-radius:4px;background:var(--gray-bg);overflow:hidden;margin-bottom:8px;}
.rm-bar > i{display:block;height:100%;background:var(--teal);}
.rm-card .pct{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;}
.rm-card .meta{font-size:11px;color:var(--ink-soft);margin-top:6px;display:flex;justify-content:space-between;}
.rm-card .meta b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:600;}

.foot-note{
  font-size:11.8px;line-height:1.6;color:var(--ink-soft);
  background:#fbf9f2;border:1px solid #ecdfc0;border-radius:var(--radius);
  padding:14px 16px;margin-top:6px;
}
.foot-note b{color:var(--ink);}
.foot-note .warn{color:var(--amber);font-weight:600;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:760px){.two-col{grid-template-columns:1fr;}}

.mini-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;}
.mini-legend span{display:inline-flex;align-items:center;gap:5px;}
.mini-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
</style>

function kpiRow(list){
  return `<div class="kpis">${list.map(k=>`
    <div class="kpi accent-${k.a}"><span class="tick"></span>
      <div class="val">${k.val}</div><div class="lbl">${k.lbl}</div>
    </div>`).join('')}</div>`;
}

function refTag(txt){ return `<span class="ref">Fonte: PMO_AGOSTO_V2_2026 · ${txt}</span>`; }

function tableHTML(headers, rows, badgeCols=[]){
  return `<div class="tbl-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${badgeCols.includes(i)?badge(c):c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---- mount ---- */
const order = ['produtos','indicadores','projetos','projAutom','politicas','erp','roadmap'];
const nav = document.getElementById('tabNav');
const host = document.getElementById('tabHost');

order.forEach((key,i)=>{
  const btn = document.createElement('button');
  btn.textContent = tabs[key].label;
  btn.className = i===0 ? 'active' : '';
  btn.onclick = ()=>selectTab(key);
  btn.dataset.key = key;
  nav.appendChild(btn);

  const sec = document.createElement('section');
  sec.className = 'tab' + (i===0?' active':'');
  sec.id = 'tab-'+key;
  sec.innerHTML = tabs[key].render();
  host.appendChild(sec);
});

function selectTab(key){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('active', s.id==='tab-'+key));
}
